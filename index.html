<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1C1C1E">
  <meta name="apple-mobile-web-app-title" content="K2">
  <title>K2</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="mobile.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header safe-top">
    <a class="brand" id="brand" href="#accueil">K2</a>
    <button class="icon-btn" id="open-settings" type="button" aria-label="Réglages"><i class="ti ti-settings"></i></button>
  </header>

  <main class="stage-area">
    <div class="stage" id="stage">
      <canvas id="game" aria-label="Paroi du K2"></canvas>

      <div class="hud" id="hud">
        <div class="hud-row hud-top">
          <div class="hud-alt"><span id="h-alt">0</span><small> m</small></div>
          <div class="hud-clock"><i class="ti" id="h-sun"></i> <span id="h-time">06:00</span> · <span id="h-temp">0°</span></div>
        </div>
        <div class="gauges">
          <div class="gauge" title="Énergie"><i class="ti ti-bolt"></i><div class="bar"><div id="g-energy"></div></div></div>
          <div class="gauge" title="Chaleur"><i class="ti ti-temperature"></i><div class="bar bar-warm"><div id="g-warmth"></div></div></div>
        </div>
        <div class="chips">
          <span class="chip" title="Vivres"><i class="ti ti-meat"></i><b id="c-food">0</b></span>
          <span class="chip" title="Gaz"><i class="ti ti-flame"></i><b id="c-gas">0</b></span>
          <span class="chip" id="chip-o2" title="Oxygène"><i class="ti ti-bottle"></i><b id="c-o2">0</b></span>
          <span class="chip chip-weather" id="chip-wind" hidden><i class="ti ti-wind"></i></span>
          <span class="chip chip-weather" id="chip-snow" hidden><i class="ti ti-snowflake"></i></span>
        </div>
      </div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>

      <section class="home" id="home">
        <h1>K2</h1>
        <p class="tagline">8 611 m de roche et de glace.<br>Seul face à la paroi.</p>
        <button class="btn btn-primary" id="btn-play" type="button"><i class="ti ti-mountain"></i><span id="btn-play-label">Grimper</span></button>
        <button class="btn" id="btn-editor" type="button"><i class="ti ti-pencil"></i> Éditeur de sprites</button>
        <p class="records" id="records"></p>
      </section>
    </div>
  </main>

  <footer class="controls safe-bottom" id="controls">
    <div class="actions">
      <button class="act" id="b-grip" type="button"><i class="ti ti-hand-grab"></i><span>Prise</span></button>
      <button class="act" id="b-eat" type="button"><i class="ti ti-meat"></i><span>Manger</span></button>
      <button class="act" id="b-o2" type="button"><i class="ti ti-bottle"></i><span>O₂</span></button>
      <button class="act" id="b-camp" type="button"><i class="ti ti-tent"></i><span>Camper</span></button>
    </div>
    <div class="steps">
      <button class="step" id="b-left" type="button"><i class="ti ti-chevron-left"></i><span>Gauche</span></button>
      <button class="step" id="b-right" type="button"><span>Droite</span><i class="ti ti-chevron-right"></i></button>
    </div>
  </footer>

  <dialog id="settings" class="modal">
    <div class="modal-head"><h2>Réglages</h2><button class="icon-btn" data-close type="button" aria-label="Fermer"><i class="ti ti-x"></i></button></div>
    <section class="block">
      <h3>Partie</h3>
      <button class="btn" id="s-new" type="button"><i class="ti ti-refresh"></i> Nouvelle ascension</button>
      <button class="btn" id="s-editor" type="button"><i class="ti ti-pencil"></i> Éditeur de sprites</button>
    </section>
    <section class="block">
      <h3>Mise à jour des sprites</h3>
      <p class="hint">Publie tes sprites dans le dépôt GitHub pour les retrouver sur tous tes appareils. Le jeton reste dans ce navigateur et n’est jamais commité.</p>
      <label class="field"><span>Jeton GitHub (droit d’écriture sur supershivas/k2)</span>
        <input id="s-token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></label>
      <button class="btn" id="s-publish" type="button"><i class="ti ti-cloud-upload"></i> Publier les sprites</button>
    </section>
    <section class="block bottom">
      <div class="version" id="s-version">v…</div>
      <ul class="changelog" id="s-changelog"></ul>
      <button class="btn" id="s-export" type="button"><i class="ti ti-download"></i> Exporter les données (JSON)</button>
      <button class="btn" id="s-import" type="button"><i class="ti ti-upload"></i> Importer un export JSON</button>
      <input type="file" id="s-file" accept="application/json,.json" hidden>
    </section>
  </dialog>

  <dialog id="editor" class="modal modal-wide">
    <div class="modal-head"><h2>Éditeur de sprites</h2><button class="icon-btn" data-close type="button" aria-label="Fermer"><i class="ti ti-x"></i></button></div>
    <div class="tabs" id="ed-tabs" role="tablist"></div>
    <div class="ed-main">
      <div class="ed-board">
        <canvas id="ed-canvas" width="16" height="16"></canvas>
        <div class="ed-grid"></div>
      </div>
      <div class="ed-side">
        <div class="ed-preview"><canvas id="ed-prev1" width="16" height="16"></canvas><canvas id="ed-prev2" width="16" height="16"></canvas></div>
        <div class="tools" id="ed-tools">
          <button class="tool" data-tool="pencil" type="button" aria-label="Crayon" title="Crayon"><i class="ti ti-pencil"></i></button>
          <button class="tool" data-tool="eraser" type="button" aria-label="Gomme" title="Gomme"><i class="ti ti-eraser"></i></button>
          <button class="tool" data-tool="fill" type="button" aria-label="Pot de peinture" title="Pot de peinture"><i class="ti ti-bucket-droplet"></i></button>
          <button class="tool" data-tool="picker" type="button" aria-label="Pipette" title="Pipette"><i class="ti ti-color-picker"></i></button>
        </div>
        <div class="tools">
          <button class="tool" id="ed-undo" type="button" aria-label="Annuler" title="Annuler"><i class="ti ti-arrow-back-up"></i></button>
          <button class="tool" id="ed-redo" type="button" aria-label="Rétablir" title="Rétablir"><i class="ti ti-arrow-forward-up"></i></button>
          <button class="tool" id="ed-flip" type="button" aria-label="Miroir" title="Miroir"><i class="ti ti-flip-horizontal"></i></button>
          <button class="tool" id="ed-clear" type="button" aria-label="Tout effacer" title="Tout effacer"><i class="ti ti-trash"></i></button>
        </div>
      </div>
    </div>
    <div class="palette" id="ed-palette"></div>
    <div class="ed-foot">
      <button class="btn" id="ed-reset" type="button"><i class="ti ti-restore"></i> Sprite d’origine</button>
      <button class="btn btn-primary" data-close type="button"><i class="ti ti-check"></i> Terminé</button>
    </div>
  </dialog>

  <dialog id="confirm" class="modal modal-narrow">
    <h2 id="cf-title"></h2>
    <p id="cf-text"></p>
    <div class="ed-foot">
      <button class="btn" id="cf-no" type="button">Annuler</button>
      <button class="btn btn-primary" id="cf-yes" type="button">Confirmer</button>
    </div>
  </dialog>

  <div class="toast" id="toast" popover="manual" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
